# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=agri-byproduct-exchange-api

# Default Profile: H2 (Enables instant running without manual DB setup)
# To use MySQL, set spring.profiles.active=mysql
spring.profiles.active=dev

# H2 Database Config for Local Dev
spring.datasource.url=jdbc:h2:mem:agri_exchange_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security Config
agri.jwt.secret=9a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b
agri.jwt.expirationMs=86400000

# XGBoost ML Microservice Integration Endpoint
agri.ml.service.url=http://localhost:5001

# Logging
logging.level.com.agriexchange=INFO
logging.level.org.springframework.security=WARN
